<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="tsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A60" />
      <stop offset="100%" stop-color="#0B1A2E" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3FA9F5" />
      <stop offset="100%" stop-color="#1473E6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="128" fill="url(#tsGrad)" />

  <!-- TeamSpeak Style Speech Bubble with Headset -->
  <g filter="url(#shadow)">
    <!-- Speech bubble -->
    <path d="M120 140 C 120 110, 140 90, 170 90 L 342 90 C 372 90, 392 110, 392 140 L 392 280 C 392 310, 372 330, 342 330 L 220 330 L 150 390 C 140 398, 120 392, 120 375 Z" fill="#FFFFFF" />

    <!-- Headset Band -->
    <path d="M190 230 C 190 170, 322 170, 322 230" fill="none" stroke="url(#accentGrad)" stroke-width="20" stroke-linecap="round" />

    <!-- Left Ear Cup -->
    <rect x="175" y="215" width="26" height="50" rx="12" fill="url(#accentGrad)" />

    <!-- Right Ear Cup -->
    <rect x="311" y="215" width="26" height="50" rx="12" fill="url(#accentGrad)" />

    <!-- Microphone boom -->
    <path d="M 185 250 C 185 285, 230 295, 255 280" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round" />
    <circle cx="258" cy="278" r="10" fill="url(#accentGrad)" />
  </g>
</svg>
