manifestVersion: 1.1
id: opencord-umbrel
name: Opencord
tagline: Open-source Discord alternative for private communities and voice chat
description: >-
  Opencord is a self-hosted, feature-rich real-time communication platform designed to be a private alternative to Discord.
  It includes text channels, voice & video rooms with screen sharing powered by LiveKit, direct messages, custom user profiles with bios, robust server permissions, and attachments with S3/MinIO.
