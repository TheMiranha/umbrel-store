<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5865F2" />
      <stop offset="100%" stop-color="#3B44B0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Fundo Arredondado com Sombra -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Símbolo Opencord (Balão de Chat + Headset / Conexão) -->
  <g filter="url(#shadow)">
    <!-- Balão Principal -->
    <path d="M140 130 C 80 130, 80 290, 80 290 C 80 370, 160 370, 160 370 L 160 410 C 160 420, 175 425, 185 415 L 235 370 L 372 370 C 432 370, 432 290, 432 290 C 432 130, 372 130, 372 130 Z" fill="#FFFFFF" />

    <!-- Olhos / Círculos do Gamepad / Discord Style -->
    <circle cx="195" cy="245" r="28" fill="#5865F2" />
    <circle cx="317" cy="245" r="28" fill="#5865F2" />

    <!-- Onda Sonora / Conexão de Voz -->
    <path d="M 235 245 Q 256 265 277 245" stroke="#5865F2" stroke-width="12" stroke-linecap="round" fill="none" />
  </g>
</svg>
